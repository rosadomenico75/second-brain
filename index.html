<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#534AB7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="lume-192.png">
<title>Second brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F1E26;--mut:#6B6976;--fnt:#A3A1AD;--line:#E8E6EE;--bg:#F6F5F9;--card:#fff;--ac:#534AB7;--ac2:#6C63D6;--acs:#EEEDFE;--dan:#C0344B;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.45;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;flex-shrink:0}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:20px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.2);border:0;border-radius:99px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;flex-shrink:0}
.hbtn svg{width:18px;height:18px}
.sum{background:var(--card);border-radius:var(--r);padding:12px;margin-top:14px;display:flex;gap:10px}
.sum div{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px}
.sum span{display:block;font-size:12px;color:var(--mut)}
.sum b{font-size:19px;font-weight:600}
.sum .ev b{color:var(--ac)}
main{flex:1;overflow-y:auto;padding:16px 16px 104px;-webkit-overflow-scrolling:touch}
.hsearch{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.95);border-radius:99px;padding:13px 16px;flex:1;min-width:0}
.hsearch svg{width:19px;height:19px;color:var(--ac);flex-shrink:0}
.hsearch input{border:0;outline:0;font:inherit;font-size:16px;flex:1;background:transparent;min-width:0;color:var(--ink)}
.hsearch input::placeholder{color:#9C9AA8}
.hsearch .clr{background:0;border:0;color:var(--mut);padding:0;cursor:pointer;display:flex}
.hsearch .clr svg{width:17px;height:17px;color:var(--mut)}
.recenti{margin-bottom:14px}
.recenti .t{font-size:12px;color:var(--mut);font-weight:500;margin-bottom:8px}
.recenti .chip svg{width:14px;height:14px;color:var(--fnt);margin-right:-2px}
.avviso{display:flex;align-items:center;gap:9px;width:100%;background:#FCF1E3;border:0;border-radius:12px;padding:12px 14px;margin-bottom:14px;font:inherit;font-size:13.5px;color:#8A5312;cursor:pointer;text-align:left}
.avviso .pallino{width:8px;height:8px;border-radius:50%;background:#D08327;flex-shrink:0}
.avviso .vai{margin-left:auto;font-weight:600;text-decoration:underline}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;background:0;border:0;border-radius:99px;padding:9px 13px;font:inherit;font-size:13.5px;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips.riga{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips.riga::-webkit-scrollbar{display:none}
.chips.riga .chip{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 14px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:500}
.chip i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.chip.on i{background:#fff!important}
.day{font-size:13px;color:var(--mut);margin:16px 0 8px;font-weight:500}
.swipe{position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:8px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px;cursor:pointer;transition:transform .18s}
.card.selon{background:var(--acs)}
.sq{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.sq svg{width:19px;height:19px}
.sq img{width:100%;height:100%;object-fit:cover}
.card .b{flex:1;min-width:0}
.card .b p{margin:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .b span{font-size:13px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .rt{font-size:12px;color:var(--fnt);flex-shrink:0}
.box{width:22px;height:22px;border-radius:7px;border:2px solid #CFCDDA;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.box.on{background:var(--ac);border-color:var(--ac)}
.box.on:after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
mark{background:#F6E7A2;color:var(--ink);border-radius:3px}
.trow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:8px}
.trow i{width:14px;height:14px;border-radius:5px;flex-shrink:0}
.trow p{margin:0;flex:1;font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .n{font-size:13px;color:var(--fnt)}
.ib{background:var(--bg);border:0;border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mut);flex-shrink:0}
.ib svg{width:17px;height:17px}
.ib.dl{color:var(--dan);background:#FBECEE}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area{border-radius:18px;padding:15px;cursor:pointer;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;color:#fff}
.area .filigrana{position:absolute;right:-14px;bottom:-18px;opacity:.16;pointer-events:none}
.area .filigrana svg{width:74px;height:74px;stroke-width:1.6}
.area .aico{position:relative}
.area .aico svg{width:22px;height:22px;color:rgba(255,255,255,.92)}
.area .abot{position:relative}
.area .abot b{display:block;font-size:16px;font-weight:600}
.area .abot span{display:block;font-size:12.5px;opacity:.85}
.area .pen{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:2}
.area .pen svg{width:13px;height:13px}
.tessera{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px;position:relative;overflow:hidden;color:#fff;margin-bottom:16px}
.tessera .filigrana{position:absolute;right:-12px;bottom:-20px;opacity:.14;pointer-events:none}
.tessera .filigrana svg{width:82px;height:82px}
.tessera .q{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.tessera .q svg{width:21px;height:21px}
.tessera .tx{flex:1;min-width:0;position:relative}
.tessera .tx b{display:block;font-size:16px;font-weight:600}
.tessera .tx span{display:block;font-size:12.5px;opacity:.86}
.tessera button{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:99px;padding:9px 15px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;position:relative;flex-shrink:0}
.icone{display:flex;flex-wrap:wrap;gap:8px;max-height:150px;overflow-y:auto}
.icone button{width:40px;height:40px;border-radius:11px;border:0;background:var(--bg);color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icone button svg{width:19px;height:19px}
.icone button.on{color:#fff}
.area.add{background:0;border:1.5px dashed #CFCDDA;color:var(--mut);align-items:center;justify-content:center}
.area.add svg{width:20px;height:20px;margin-bottom:6px}
.area.add p{font-size:14px;font-weight:500;color:var(--mut)}
.wig{animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
.big{width:100%;background:var(--card);border:1.5px dashed #CFCDDA;border-radius:var(--r);padding:15px;font:inherit;font-size:15px;font-weight:500;color:var(--ac);cursor:pointer;margin-bottom:14px}
.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty .ic{width:74px;height:74px;border-radius:50%;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty .ic svg{width:28px;height:28px}
.empty b{display:block;font-weight:600;color:var(--ink);margin-bottom:4px;font-size:16px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(83,74,183,.38);cursor:pointer;z-index:15}
.fab svg{width:25px;height:25px;stroke-width:2.4}
.mosaico{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.mosaico img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:0;border:0;padding:10px 0 12px;font:inherit;font-size:11px;color:var(--fnt);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ac);font-weight:500}
.selbar{position:fixed;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;z-index:16;box-shadow:0 6px 20px rgba(31,30,38,.14)}
.selbar button{flex:1;background:var(--bg);border:0;border-radius:10px;padding:12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.selbar button.dl{color:var(--dan);background:#FBECEE}
.sheet{position:fixed;inset:0;background:rgba(31,30,38,.45);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom));max-height:94dvh;overflow-y:auto}
.panel h3{font-size:18px;font-weight:600;margin:0 0 16px}
.fl{font-size:12px;color:var(--mut);margin:0 0 7px;font-weight:500}
textarea,input.tx,select{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--bg);color:var(--ink);outline:0;resize:none}
textarea:focus,input.tx:focus{border-color:var(--ac);background:var(--card)}
.tagbox{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 10px}
.tagbox:focus-within{border-color:var(--ac);background:var(--card)}
.tagbox .sel{display:flex;flex-wrap:wrap;gap:6px}
.tagbox .sel:not(:empty){margin-bottom:7px}
.tagbox input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:16px;padding:4px 2px;color:var(--ink)}
.sugwrap{max-height:150px;overflow-y:auto;margin-top:10px}
.dup{display:flex;gap:10px;background:#FCF1E3;border-radius:12px;padding:12px;margin-bottom:14px;align-items:flex-start}
.dup svg{width:18px;height:18px;color:#8A5312;flex-shrink:0;margin-top:1px}
.dup p{margin:0;font-size:13.5px;color:#8A5312}
.dup a{color:#8A5312;font-weight:600;text-decoration:underline;cursor:pointer}
.warn{font-size:13px;color:#8A5312;margin:9px 0 0}
.proposta{display:flex;gap:8px;align-items:flex-start;background:var(--acs);color:var(--ac);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 14px}
.proposta svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.row{display:flex;gap:10px;margin-top:14px}
.row>div{flex:1}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:42px;height:42px;border-radius:12px;border:2.5px solid transparent;cursor:pointer;padding:0}
.sw button.on{border-color:var(--ink)}
.sw button.bloccato{opacity:.28;cursor:not-allowed;position:relative}
.sw button.bloccato:after{content:"";position:absolute;left:8px;top:19px;width:24px;height:2.5px;background:#fff;transform:rotate(-45deg);border-radius:2px}
.sw{max-height:150px;overflow-y:auto}
.save{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:600;font-size:15px;margin-top:18px;cursor:pointer}
.save.dl{background:var(--dan)}
.ghost{width:100%;background:0;border:0;color:var(--mut);padding:12px;font:inherit;font-size:14px;margin-top:4px;cursor:pointer}
.menu button{display:flex;align-items:center;gap:14px;width:100%;background:var(--bg);border:0;border-radius:12px;padding:14px;font:inherit;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;margin-bottom:9px;text-align:left}
.menu .ic{width:38px;height:38px;border-radius:11px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu .ic svg{width:18px;height:18px}
.risorsa{display:flex;align-items:center;gap:11px;width:100%;border:1.5px solid;border-radius:12px;padding:12px;margin-bottom:14px;text-decoration:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.risorsa .ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.risorsa .ico svg{width:20px;height:20px}
.risorsa .txt{min-width:0;flex:1;display:block}
.risorsa .txt b{display:block;font-size:14.5px;font-weight:500}
.risorsa .txt span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.risorsa .az{flex-shrink:0;display:flex}
.risorsa .az svg{width:19px;height:19px}
.onda{display:flex;align-items:center;gap:2px;height:16px}
.onda i{flex:1;opacity:.45;border-radius:2px}
.azioni{display:flex;gap:10px;align-items:center;margin-top:16px}
.azioni.sotto{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.secondario{flex:1;background:0;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;font-size:14.5px;color:var(--mut);cursor:pointer}
.ghost.dl{color:var(--dan);flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.ghost.dl svg{width:15px;height:15px}
.azioni .ghost{flex:1}
.lightbox{position:fixed;inset:0;background:rgba(15,14,20,.94);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox .chiudi{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(255,255,255,.18);border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lightbox .chiudi svg{width:20px;height:20px}
.prev{cursor:zoom-in}
.dial{text-align:center;padding:8px 0 4px}
.dot{width:92px;height:92px;border-radius:50%;background:var(--ac);color:#fff;border:0;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:p 1.4s infinite}
.dot svg{width:32px;height:32px}
@keyframes p{50%{transform:scale(1.06)}}
.tm{font-size:26px;font-weight:600}
.hint{font-size:13px;color:var(--fnt);margin:4px 0 0}
audio{width:100%;margin-bottom:14px}
.prev{width:100%;border-radius:12px;display:block;margin-bottom:14px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;background:var(--ink);color:#fff;padding:13px 15px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<button class="fab" onclick="menuNuovo()" aria-label="Aggiungi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fpick" accept="image/*" multiple style="display:none">
<script>
const DBN='secondbrain-v1';
let _db=null;
function idb(){
 if(_db)return Promise.resolve(_db);
 return new Promise((res,rej)=>{const r=indexedDB.open(DBN,2);
 r.onblocked=()=>rej(new Error('database occupato'));
 r.onupgradeneeded=e=>{const d=e.target.result;
  if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});
  if(!d.objectStoreNames.contains('areas'))d.createObjectStore('areas',{keyPath:'n'});
  if(!d.objectStoreNames.contains('tags'))d.createObjectStore('tags',{keyPath:'n'});
  if(!d.objectStoreNames.contains('pending'))d.createObjectStore('pending',{keyPath:'id',autoIncrement:true});};
 r.onsuccess=()=>{_db=r.result;_db.onclose=()=>{_db=null};res(_db)};
 r.onerror=()=>rej(r.error)})}
async function all(s){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(s,'readonly').objectStore(s).getAll();t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
async function put(s,o){
 try{
  const db=await idb();
  return await new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)});
 }catch(e){toast('Salvataggio non riuscito: '+(e&&e.message?e.message:'errore'));throw e}
}
async function del(s,k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const I={
 link:'<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
 foto:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-4.5-4.5L9 18"/></svg>',
 nota:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
 vocale:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
 pen:'<svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/></svg>',
 tra:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>',
 sea:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
 tag:'<svg viewBox="0 0 24 24"><path d="M3 11V5a2 2 0 0 1 2-2h6l10 10-8 8z"/><circle cx="8" cy="8" r="1.4"/></svg>',

   :'<button class="ghost" onclick="close_()">Annulla</button>'));
 const ti=$('ti');
 ti.oninput=function(){C.typed=ti.value.toLowerCase();refreshSug()};
 ti.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();const v=ti.value.trim();if(v)addtag(v)}};
}
function etichettaSalva(){
 if(C.editing)return 'Salva';
 const parti=[];
 if(C.a)parti.push(C.a);
 if(C.tg.length)parti.push(C.tg.join(', '));
 return parti.length?'Salva in '+parti.join(' · '):'Salva';
}
function aggiornaBtn(){const b=$('btnsalva');if(b)b.textContent=etichettaSalva()}
function selHTML(){return C.tg.map(t=>'<button class="chip on" onclick="untag(\''+esc(t)+'\')"><i style="background:'+TC(t)+'"></i>'+esc(t)+' ✕</button>').join('')}
function dupHTML(){
 if(C.t!=='link'||C.editing)return '';
 const d=findDup(C.s);if(!d||d.id===C.id)return '';
 return '<div class="dup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><p>Ce l\'hai già: salvato il '+fmtb(d.d)+(d.a?' in '+esc(d.a):'')+'. <a onclick="det('+d.id+')">Apri</a></p></div>';
}
function sugHTML(){
 const w=(C.typed||'').trim();
 const l=suggest(C.a,C.s,w).filter(t=>C.tg.indexOf(t)<0);
 let h=l.map(t=>'<button class="chip" onclick="addtag(\''+esc(t)+'\')"><i style="background:'+TC(t)+'"></i>'+esc(t)+'</button>').join('');
 if(w&&l.indexOf(w)<0)h+='<button class="chip" style="border-style:dashed;color:var(--ac)" onclick="addtag(\''+esc(w)+'\')">+ crea «'+esc(w)+'»</button>';
 if(!h)h='<span style="font-size:13.5px;color:var(--fnt)">Nessun tag. Scrivine uno per crearlo.</span>';
 let wr='';
 if(w&&TN().indexOf(w)<0){const s=simile(w,TN());if(s)wr='<p class="warn">Esiste già «'+esc(s)+'», molto simile.</p>'}
 return '<div class="chips sugwrap">'+h+'</div>'+wr;
}
function refreshDup(){const e=$('dupbox');if(e)e.innerHTML=dupHTML()}
function refreshSel(){const e=$('selbox');if(e)e.innerHTML=selHTML()}
function refreshSug(){const e=$('sugbox');if(e)e.innerHTML=sugHTML()}
async function addtag(t){
 t=t.toLowerCase().trim();
 if(!t)return;
 if(C.tg.indexOf(t)<0)C.tg.push(t);
 C.typed='';const ti=$('ti');if(ti){ti.value='';ti.focus()}
 refreshSel();refreshSug();aggiornaBtn();
 if(TN().indexOf(t)<0){
  const o={n:t,c:primoLibero(coloriTag())};
  try{await put('tags',o);TAGS.push(o);TAGS.sort((a,b)=>a.n.localeCompare(b.n));toast('Tag «'+t+'» creato')}
  catch(e){}
 }
}
function untag(t){C.tg=C.tg.filter(x=>x!==t);refreshSel();refreshSug();aggiornaBtn()}
async function salva(){
 const it={id:C.id||Date.now(),t:C.t,ti:$('ds').value.trim()||'Senza descrizione',tg:C.tg.slice(),a:$('ar').value,
  s:C.t==='link'?($('ur')?$('ur').value.trim():C.s):(C.s||''),d:$('dt').value||today(),blob:C.blob||null,mini:C.mini||null,dur:C.dur||''};
 await put('items',it);
 D=D.filter(x=>x.id!==it.id);D.push(it);
 close_();tab='voci';q='';fTag='';fTipo='';render();toast('Salvato');
}
let COLUSATI={};
function swatches(usati){
 usati=usati||{};COLUSATI=usati;
 return '<div class="sw">'+Object.keys(COL).map(function(k){
  const u=usati[k];
  if(u)return '<button style="background:'+COL[k]+'" class="bloccato" disabled aria-label="'+k+', già di '+esc(u)+'" title="già di '+esc(u)+'"></button>';
  return '<button style="background:'+COL[k]+'" class="'+(pickC===k?'on':'')+'" '
   +'onclick="pickC=\''+k+'\';[].forEach.call(document.querySelectorAll(\'.sw button\'),function(b){b.classList.remove(\'on\')});this.classList.add(\'on\')" aria-label="'+k+'"></button>';
 }).join('')+'</div>';
}
let pickI='cartella';
function iconePick(){
 return '<div class="icone">'+Object.keys(AICO).map(function(k){
  return '<button class="'+(pickI===k?'on':'')+'" style="'+(pickI===k?'background:'+COL[pickC]:'')+'" onclick="pickI=\''+k+'\';[].forEach.call(document.querySelectorAll(\'.icone button\'),function(b){b.classList.remove(\'on\');b.style.background=\'\'});this.classList.add(\'on\');this.style.background=COL[pickC]" aria-label="'+k+'">'+AICO[k]+'</button>';
 }).join('')+'</div>';
}
function coloriTag(escludi){const u={};TAGS.forEach(t=>{if(t.n!==escludi)u[t.c]=t.n});return u}
function nuovoTagCol(){const u=coloriTag();return primoLibero(u)}
function nuovoTag(){COLUSATI=coloriTag();pickC=primoLibero(COLUSATI);
 sheet('<h3>Nuovo tag</h3><p class="fl">Nome</p><input class="tx" id="nt" placeholder="allestimento" autocapitalize="none">'
 +'<p class="fl" style="margin-top:14px">Colore</p>'+swatches(COLUSATI)
 +'<button class="save" onclick="addTag()">Crea</button><button class="ghost" onclick="close_()">Annulla</button>');setTimeout(()=>$('nt').focus(),120)}
async function addTag(){const v=$('nt').value.toLowerCase().trim();if(!v){toast('Scrivi un nome');return}
 if(TN().indexOf(v)>=0){toast('Esiste già');return}
 if(coloriTag()[pickC]){toast('Colore già usato');return}
 const o={n:v,c:pickC};await put('tags',o);TAGS.push(o);TAGS.sort((a,b)=>a.n.localeCompare(b.n));close_();render();toast('Tag creato')}
function editTag(n){const t=TAGS.find(x=>x.n===n);pickC=t.c;COLUSATI=coloriTag(n);
 sheet('<h3>Modifica tag</h3><p class="fl">Nome</p><input class="tx" id="nt" value="'+esc(n)+'" autocapitalize="none">'
 +'<p class="fl" style="margin-top:14px">Colore</p>'+swatches(COLUSATI)
 +'<button class="save" onclick="saveTag(\''+esc(n)+'\')">Salva</button><button class="ghost" onclick="close_()">Annulla</button>')}
async function saveTag(old){const v=$('nt').value.toLowerCase().trim();if(!v){toast('Scrivi un nome');return}
 if(coloriTag(old)[pickC]){toast('Colore già usato');return}
 if(v!==old){
  for(const i of D)if(i.tg.indexOf(old)>=0){i.tg=i.tg.map(x=>x===old?v:x).filter((x,k,a)=>a.indexOf(x)===k);await put('items',i)}
  TAGS=TAGS.filter(x=>x.n!==old);await del('tags',old);TAGS.push({n:v,c:pickC});
  if(fTag===old)fTag=v;
 } else {const t=TAGS.find(x=>x.n===old);t.c=pickC}
 await put('tags',{n:v,c:pickC});close_();render();toast('Tag aggiornato')}
function delTag(n){const c=conta(n);
 sheet('<h3>Eliminare «'+esc(n)+'»?</h3><p style="font-size:14px;color:var(--mut);margin:0">'+(c?'Sparisce da '+c+' voci, che restano.':'Non è usato da nessuna voce.')+'</p>'
 +'<button class="save dl" onclick="doDelTag(\''+esc(n)+'\')">Elimina</button><button class="ghost" onclick="close_()">Annulla</button>')}
async function doDelTag(n){
 for(const i of D)if(i.tg.indexOf(n)>=0){i.tg=i.tg.filter(x=>x!==n);await put('items',i)}
 TAGS=TAGS.filter(x=>x.n!==n);await del('tags',n);if(fTag===n)fTag='';close_();render();toast('Tag eliminato')}
function coloriAree(escludi){
 const u={};AREE.forEach(a=>{if(a.n!==escludi)u[a.c]=a.n});return u;
}
function primoLibero(u){const k=Object.keys(COL).find(x=>!u[x]);return k||'viola'}
function newArea(){const u=coloriAree();pickC=primoLibero(u);pickI='cartella';
 sheet('<h3>Nuova area</h3><p class="fl">Nome</p><input class="tx" id="na" placeholder="Viaggi">'
 +'<p class="fl" style="margin-top:14px">Colore</p>'+swatches(u)
 +'<p style="font-size:12.5px;color:var(--mut);margin:8px 0 0">I colori sbarrati sono già di un\'altra area.</p>'
 +'<p class="fl" style="margin-top:14px">Icona</p>'+iconePick()
 +'<button class="save" onclick="addArea()">Crea</button><button class="ghost" onclick="close_()">Annulla</button>');setTimeout(()=>$('na').focus(),120)}
async function addArea(){const v=$('na').value.trim();if(!v){toast('Scrivi un nome');return}
 if(AN().indexOf(v)>=0){toast('Esiste già');return}
 if(coloriAree()[pickC]){toast('Colore già usato');return}
 const o={n:v,c:pickC,ic:pickI};AREE.push(o);await put('areas',o);close_();render();toast('Area creata')}
function editArea(n){const a=AREE.find(x=>x.n===n);pickC=a.c;pickI=a.ic||'cartella';
 sheet('<h3>Modifica area</h3><p class="fl">Nome</p><input class="tx" id="na" value="'+esc(a.n)+'">'
 +'<p class="fl" style="margin-top:14px">Colore</p>'+swatches(coloriAree(n))
 +'<p style="font-size:12.5px;color:var(--mut);margin:8px 0 0">I colori sbarrati sono già di un\'altra area.</p>'
 +'<p class="fl" style="margin-top:14px">Icona</p>'+iconePick()
 +'<button class="save" onclick="saveArea(\''+esc(n)+'\')">Salva</button>'
 +'<div class="azioni sotto"><button class="ghost dl" style="margin:0" onclick="chiediDelArea(\''+esc(n)+'\')">'+I.tra+' Elimina area</button>'
 +'<button class="ghost" style="margin:0" onclick="close_()">Annulla</button></div>')}
async function saveArea(old){const v=$('na').value.trim();if(!v){toast('Scrivi un nome');return}
 if(coloriAree(old)[pickC]){toast('Colore già usato');return}
 const a=AREE.find(x=>x.n===old);a.n=v;a.c=pickC;a.ic=pickI;
 if(v!==old){await del('areas',old);for(const i of D)if(i.a===old){i.a=v;await put('items',i)}if(area===old)area=v}
 await put('areas',{n:v,c:pickC,ic:pickI});close_();render();toast('Area aggiornata')}
function chiediDelArea(n){const c=D.filter(i=>i.a===n).length;
 sheet('<h3>Eliminare «'+esc(n)+'»?</h3><p style="font-size:14px;color:var(--mut);margin:0">'+(c?'Le '+c+' voci restano, ma senza area.':'L\'area è vuota.')+'</p>'
 +'<button class="save dl" onclick="doDelArea(\''+esc(n)+'\')">Elimina</button><button class="ghost" onclick="close_()">Annulla</button>')}
async function doDelArea(n){
 for(const i of D)if(i.a===n){i.a='';await put('items',i)}
 AREE=AREE.filter(x=>x.n!==n);await del('areas',n);if(area===n)area='';close_();render();toast('Area eliminata')}
async function aggiorna(){
 try{
  if('caches' in window){const k=await caches.keys();for(const x of k)await caches.delete(x)}
  if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}
  toast('Ricarico la versione nuova');
  setTimeout(()=>location.reload(true),700);
 }catch(e){toast('Non riesco ad aggiornare')}
}
async function persist(){if(!navigator.storage||!navigator.storage.persist){toast('Non supportato');return}
 const ok=await navigator.storage.persist();toast(ok?'Dati protetti':'Android ha rifiutato, riprova più avanti')}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function esporta(){
 const out={v:3,at:new Date().toISOString(),aree:AREE,tags:TAGS,items:[]};
 for(const i of D){const o=Object.assign({},i);if(i.blob)o.blob=await b2d(i.blob);if(i.mini)o.mini=await b2d(i.mini);out.items.push(o)}
 const u=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
 const a=document.createElement('a');a.href=u;a.download='second-brain-'+today()+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Backup scaricato')}
async function importa(el){
 const f=el.files[0];el.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());
  for(const a of (j.aree||[])){if(AN().indexOf(a.n)<0){AREE.push(a);await put('areas',a)}}
  for(const t of (j.tags||[])){const o=typeof t==='string'?{n:t,c:'viola'}:t;if(TN().indexOf(o.n)<0){TAGS.push(o);await put('tags',o)}}
  let n=0;
  for(const it of (j.items||[])){if(D.some(x=>x.id===it.id))continue;
   const o=Object.assign({},it);
   if(typeof o.blob==='string')o.blob=await (await fetch(o.blob)).blob();
   if(typeof o.mini==='string')o.mini=await (await fetch(o.mini)).blob();
   await put('items',o);D.push(o);n++}
  render();toast(n+' voci importate')}catch(e){toast('File non valido')}
}
function daIndirizzo(){
 const p=new URLSearchParams(location.search);
 const u=(p.get('u')||p.get('url')||'').trim();
 const t=(p.get('t')||p.get('text')||p.get('title')||'').trim();
 if(!u&&!t)return false;
 const m=(u+' '+t).match(/https?:\/\/\S+/);
 if(m)cap({t:'link',s:m[0],ti:t.replace(m[0],'').trim()});
 else cap({t:'nota',ti:t||u});
 return true;
}
async function checkPending(){
 if($('sheet').classList.contains('open'))return;
 const p=await all('pending');if(!p.length)return;
 const s=p[p.length-1];for(const x of p)await del('pending',x.id);
 const url=(s.url||'').trim()||(((s.text||'').match(/https?:\/\/\S+/)||[''])[0]);
 const desc=(s.title||'').trim()||(s.text||'').replace(url,'').trim();
 if(s.file&&s.file.size)cap({t:'foto',blob:await shrink(s.file),mini:await shrink(s.file,320),ti:desc});
 else if(url)cap({t:'link',s:url,ti:desc});
 else if(desc)cap({t:'nota',ti:desc});
}
async function boot(){
 try{D=await all('items');AREE=await all('areas');TAGS=await all('tags')}
 catch(e){$('main').innerHTML='<div class="empty"><b>Archivio non accessibile</b>Controlla di non essere in navigazione privata.</div>';return}
 if(!AREE.length){AREE=[{n:'Lavoro',c:'blu',ic:'valigetta'},{n:'Casa',c:'ambra',ic:'casa'},{n:'Idee',c:'verde',ic:'lampadina'}];for(const a of AREE)await put('areas',a)}
 AREE=AREE.map(a=>a.ic?a:Object.assign({},a,{ic:'cartella'}));
 TAGS=TAGS.map(t=>typeof t==='string'?{n:t,c:'viola'}:(t.c?t:{n:t.n,c:'viola'})).sort((a,b)=>a.n.localeCompare(b.n));
 render();
 await checkPending();
 daIndirizzo();
 if(location.search)history.replaceState({},'',location.pathname);
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('sheet').classList.contains('open'))checkPending()});
boot();
</script>
</body>
</html>
