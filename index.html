<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#534AB7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Second brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1A1E;--mut:#6B6B75;--fnt:#A0A0AA;--line:#E6E5EA;--bg:#F7F7F9;--card:#fff;--ac:#534AB7;--acs:#EEEDFE;--wr:#854F0B;--wrs:#FAEEDA;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.45;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:'JetBrains Mono',monospace}
#hdr{flex-shrink:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--bg)}
.hrow{display:flex;align-items:center;gap:10px;min-height:34px}
.hrow h1{font-size:19px;font-weight:500;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.homebtn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.75);border:0;border-radius:99px;padding:7px 13px 7px 9px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;flex-shrink:0}
.homebtn svg{width:15px;height:15px}
.act{background:rgba(255,255,255,.75);border:0;border-radius:99px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.act svg{width:16px;height:16px}
.act.on{background:var(--ac);color:#fff}
.top{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-top:12px}
.top svg{width:17px;height:17px;color:var(--fnt);flex-shrink:0}
.top input{border:0;outline:0;font:inherit;flex:1;background:transparent;min-width:0;color:var(--ink)}
.top input::placeholder{color:var(--fnt)}
main{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sect{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.sect span{font-size:11px;color:var(--fnt);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.sect button{background:0;border:0;font:inherit;font-size:13.5px;color:var(--ac);cursor:pointer;font-weight:500;padding:2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.area p{margin:0;font-size:15px;font-weight:500;line-height:1.25}
.area .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--fnt)}
.area .pen{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.area .pen svg{width:13px;height:13px}
.area.add{align-items:center;justify-content:center;border-style:dashed;color:var(--mut)}
.area.add svg{width:19px;height:19px;margin-bottom:5px}
.area.add p{font-weight:400;font-size:13.5px;color:var(--mut)}
.wig{animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
.rec{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--ac);color:#fff;border:0;border-radius:var(--r);padding:15px;font:inherit;font-weight:500;font-size:15px;margin-top:16px;cursor:pointer}
.rec svg{width:18px;height:18px}
.mini{display:flex;gap:8px;margin-top:9px}
.mini button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 4px;font:inherit;font-size:12.5px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mini svg{width:17px;height:17px}
.tagsmg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:0;border:0;color:var(--mut);padding:13px;font:inherit;font-size:13.5px;cursor:pointer}
.tagsmg svg{width:16px;height:16px}
.cap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:18px}
.cap .fl{margin-top:12px}
.cap .fl:first-child{margin-top:0}
.cnt{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--fnt);margin:0 0 8px}
.item{display:flex;gap:11px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:first-of-type{border-top:0}
.item>svg{width:17px;height:17px;color:var(--fnt);flex-shrink:0;margin-top:3px}
.item img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0}
.item p{margin:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:12px;color:var(--fnt);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .b{flex:1;min-width:0}
mark{background:#F4E9A8;color:var(--ink);border-radius:2px}
.empty{text-align:center;padding:44px 16px;color:var(--mut)}
.empty b{display:block;font-weight:500;color:var(--ink);margin-bottom:3px}
.trow{display:flex;align-items:center;gap:11px;padding:13px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow p{margin:0;flex:1;font-size:15px}
.trow .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--fnt)}
.trow button{background:0;border:0;color:var(--mut);cursor:pointer;padding:4px}
.trow button svg{width:17px;height:17px}
.sheet{position:fixed;inset:0;background:rgba(26,26,30,.4);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:94dvh;overflow-y:auto}
.panel h3{font-size:17px;font-weight:500;margin:0 0 14px}
.fl{font-size:11px;color:var(--fnt);text-transform:uppercase;letter-spacing:.07em;margin:0 0 7px;font-weight:500}
textarea,input.tx,select{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);color:var(--ink);outline:0;resize:none}
textarea:focus,input.tx:focus{border-color:var(--ac);background:var(--card)}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:11px;border:2px solid transparent;cursor:pointer;padding:0}
.sw button.on{border-color:var(--ink)}
.dup{display:flex;gap:9px;background:var(--wrs);border-radius:10px;padding:11px 12px;margin-bottom:14px;align-items:flex-start}
.dup svg{width:17px;height:17px;color:var(--wr);flex-shrink:0;margin-top:2px}
.dup p{margin:0;font-size:13.5px;color:var(--wr)}
.dup a{color:var(--wr);font-weight:500;cursor:pointer;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mut);cursor:pointer;background:0;font-family:inherit}
.chip.on{background:var(--acs);border-color:transparent;color:var(--ac);font-weight:500}
.chip .n{font-family:'JetBrains Mono',monospace;font-size:10.5px;margin-left:5px;opacity:.65}
.chip.new{border-style:dashed;color:var(--ac)}
.tagbox{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 9px}
.tagbox:focus-within{border-color:var(--ac);background:var(--card)}
.tagbox .sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tagbox .sel:empty{display:none}
.tagbox input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:16px;padding:3px 2px;color:var(--ink)}
.sug{margin-top:9px}
.sugwrap{max-height:132px;overflow-y:auto}
.warn{font-size:12.5px;color:var(--wr);margin:8px 0 0}
.row{display:flex;gap:9px;margin-top:14px}
.row>div{flex:1}
.save{width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:500;font-size:15px;margin-top:18px;cursor:pointer}
.ghost{width:100%;background:0;border:0;color:var(--mut);padding:11px;font:inherit;font-size:14px;margin-top:2px;cursor:pointer}
.danger{color:#A32D2D}
.prev{width:100%;border-radius:10px;margin-bottom:14px;display:block}
.dial{text-align:center;padding:6px 0 2px}
.dot{width:84px;height:84px;border-radius:50%;background:var(--acs);border:0;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ac)}
.dot svg{width:30px;height:30px}
.dot.live{background:var(--ac);color:#fff;animation:p 1.4s infinite}
@keyframes p{50%{transform:scale(1.05)}}
.tm{font-family:'JetBrains Mono',monospace;font-size:25px}
.hint{font-size:12.5px;color:var(--fnt);margin:3px 0 0}
audio{width:100%;margin-bottom:14px}
.toast{position:fixed;left:16px;right:16px;bottom:22px;max-width:400px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;font-size:13.5px;opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="main"></main>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fpick" accept="image/*" style="display:none">
<script>
/* ---------- archivio ---------- */
const DBN='secondbrain-v1';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);
 r.onupgradeneeded=e=>{const d=e.target.result;
  if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});
  if(!d.objectStoreNames.contains('areas'))d.createObjectStore('areas',{keyPath:'n'});
  if(!d.objectStoreNames.contains('pending'))d.createObjectStore('pending',{keyPath:'id',autoIncrement:true});};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function all(s){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(s,'readonly').objectStore(s).getAll();t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
async function put(s,o){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function del(s,k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function clear(s){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/* ---------- icone e colori ---------- */
const I={
 link:'<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
 foto:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-6 6"/></svg>',
 nota:'<svg viewBox="0 0 24 24"><path d="M5 4h11l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 12h8M8 16h5"/></svg>',
 vocale:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
 pen:'<svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/></svg>',
 sea:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
 arr:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 fil:'<svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
 cog:'<svg viewBox="0 0 24 24"><path d="M10.3 4.5a1 1 0 0 1 1-.9h1.4a1 1 0 0 1 1 .9l.15 1.05 1.05.6 1-.4a1 1 0 0 1 1.2.45l.7 1.2a1 1 0 0 1-.2 1.25l-.85.7v1.2l.85.7a1 1 0 0 1 .2 1.25l-.7 1.2a1 1 0 0 1-1.2.45l-1-.4-1.05.6-.15 1.05a1 1 0 0 1-1 .9h-1.4a1 1 0 0 1-1-.9l-.15-1.05-1.05-.6-1 .4a1 1 0 0 1-1.2-.45l-.7-1.2a1 1 0 0 1 .2-1.25l.85-.7v-1.2l-.85-.7a1 1 0 0 1-.2-1.25l.7-1.2a1 1 0 0 1 1.2-.45l1 .4 1.05-.6z"/><circle cx="12" cy="12" r="2.6"/></svg>',
 cest:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>'};
const PAL={viola:['#EEEDFE','#534AB7'],verde:['#E1F5EE','#0F6E56'],ambra:['#FAEEDA','#854F0B'],blu:['#E6F1FB','#185FA5'],rosa:['#FBEAF0','#993556'],grigio:['#F1EFE8','#5F5E5A']};

/* ---------- stato ---------- */
let D=[],AREE=[],view='home',area='',q='',ftg=[],edit=false,C=null,pickC='viola';
let recT=null,recS=0,mediaRec=null,chunks=[],urls=new Map();
const $=i=>document.getElementById(i);
const M=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fmt=s=>{const x=new Date(s);return x.getDate()+' '+M[x.getMonth()]+' '+x.getFullYear()};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hl=s=>{s=esc(s);const w=q.trim();return w?s.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'):s};
const AN=()=>AREE.map(a=>a.n);
const AC=n=>{const a=AREE.find(x=>x.n===n);return PAL[a?a.c:'grigio']};
const oUrl=i=>{if(!i.blob)return '';if(!urls.has(i.id))urls.set(i.id,URL.createObjectURL(i.blob));return urls.get(i.id)};
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};

function norm(u){
 if(!u)return '';
 let x=String(u).trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('#')[0];
 const p=x.split('?')[0],qs=x.split('?')[1];
 const yb=p.match(/^youtu\.be\/([\w-]+)/);if(yb)return 'yt:'+yb[1];
 if(p==='youtube.com/watch'&&qs){const v=qs.split('&').find(k=>k.startsWith('v='));if(v)return 'yt:'+v.slice(2)}
 let keep='';
 if(qs){const k=qs.split('&').filter(kv=>!/^(utm_|si=|fbclid|igsh|feature=|ref=)/.test(kv));if(k.length)keep='?'+k.join('&')}
 return (p+keep).replace(/\/$/,'');
}
const dom=u=>{const n=norm(u);return n.startsWith('yt:')?'youtube':(n.split('/')[0]||'')};
const findDup=u=>{const n=norm(u);return n?D.find(i=>i.s&&norm(i.s)===n):null};
const allTags=()=>{const c={};D.forEach(i=>i.tg.forEach(t=>c[t]=(c[t]||0)+1));return c};
function suggest(ar,src,typed){
 const c={};
 D.forEach(i=>{let w=1;if(ar&&i.a===ar)w+=6;if(src&&dom(i.s)&&dom(i.s)===dom(src))w+=3;i.tg.forEach(t=>c[t]=(c[t]||0)+w)});
 let l=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
 if(typed)l=l.filter(t=>t.includes(typed));
 return l.slice(0,typed?12:20);
}
const simile=(t,a)=>a.find(x=>x!==t&&(x.startsWith(t)||t.startsWith(x)||(Math.abs(x.length-t.length)<=1&&[...x].filter((c,k)=>c!==t[k]).length<=1)));
function results(){
 const w=q.trim().toLowerCase();
 return D.filter(i=>{
  if(view==='area'&&i.a!==area)return false;
  if(view==='smista'&&i.tg.length)return false;
  if(!ftg.every(t=>i.tg.includes(t)))return false;
  if(!w)return true;
  return ((i.ti||'')+' '+i.tg.join(' ')).toLowerCase().includes(w);
 }).sort((a,b)=>String(b.d).localeCompare(String(a.d)));
}
const thumb=i=>i.t==='foto'&&i.blob?`<img src="${oUrl(i)}" alt="">`:I[i.t];
const row=i=>`<div class="item" onclick="det(${i.id})">${thumb(i)}<div class="b"><p>${hl(i.ti||'Senza descrizione')}</p><div class="m">${[i.tg.join(' · '),fmt(i.d)].filter(Boolean).join(' — ')}</div></div></div>`;

/* ---------- interfaccia ---------- */
function header(){
 const h=$('hdr');
 if(view==='home'){
  h.style.background='var(--bg)';h.style.color='var(--ink)';
  h.innerHTML=`<div class="hrow"><h1>Second brain</h1><button class="act" onclick="impostazioni()" aria-label="Impostazioni">${I.cog}</button></div>
   <div class="top">${I.sea}<input id="q" placeholder="Cerca in tutto" value="${esc(q)}"></div>`;
 } else if(view==='tags'){
  h.style.background='var(--bg)';h.style.color='var(--ink)';
  h.innerHTML=`<div class="hrow"><button class="homebtn" onclick="home()">${I.arr}Home</button><h1 style="text-align:right">Tag</h1></div>`;
 } else {
  const c=view==='area'?AC(area):['var(--acs)','var(--ac)'];
  h.style.background=c[0];h.style.color=c[1];
  h.innerHTML=`<div class="hrow"><button class="homebtn" onclick="home()" style="color:${c[1]}">${I.arr}Home</button>
   <h1 style="text-align:center">${view==='area'?esc(area):'Da smistare'}</h1>
   ${view==='area'?`<button class="act" style="color:${c[1]}" onclick="editArea('${esc(area)}')" aria-label="Modifica area">${I.pen}</button>`:''}
   <button class="act ${ftg.length?'on':''}" onclick="filtri()" aria-label="Filtri" style="${ftg.length?'':'color:'+c[1]}">${I.fil}</button></div>
   <div class="top">${I.sea}<input id="q" placeholder="Cerca qui dentro" value="${esc(q)}"></div>`;
 }
 const e=$('q');if(e)e.oninput=v=>{q=v.target.value;const p=e.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(p,p)};
}
function render(){
 header();const m=$('main');
 if(view==='home'){
  if(q.trim()){const r=results();m.innerHTML=`<div class="cnt">${r.length} risultati</div>`+(r.length?r.map(row).join(''):'<div class="empty"><b>Nessun risultato</b>Prova con un\'altra parola.</div>');return}
  const ns=D.filter(i=>!i.tg.length).length;
  m.innerHTML=`<div class="sect"><span>Aree</span><button onclick="edit=!edit;render()">${edit?'Fine':'Modifica'}</button></div><div class="grid">`
   +AREE.map(a=>{const c=PAL[a.c];return `<div class="area ${edit?'wig':''}" style="background:${c[0]};border-color:transparent" onclick="${edit?`editArea('${esc(a.n)}')`:`openArea('${esc(a.n)}')`}">
     ${edit?`<span class="pen" style="color:${c[1]}">${I.pen}</span>`:''}
     <p style="color:${c[1]}">${esc(a.n)}</p><span class="n" style="color:${c[1]};opacity:.6">${D.filter(i=>i.a===a.n).length}</span></div>`}).join('')
   +`<div class="area" onclick="${edit?'':`view='smista';q='';ftg=[];render()`}"><p>Da smistare</p><span class="n">${ns}</span></div>
   <div class="area add" onclick="newArea()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><p>Nuova area</p></div></div>
   <button class="rec" style="background:var(--card);color:var(--ink);border:1px solid var(--line)" onclick="pasteLink()">${I.link}Cattura un link</button>
   <button class="rec" onclick="recorder()">${I.vocale}Registra un appunto</button>
   <div class="mini"><button onclick="cap({t:'nota'})">${I.nota}Appunto</button><button onclick="pickPhoto()">${I.foto}Foto</button></div>
   <button class="tagsmg" onclick="view='tags';render()"><svg viewBox="0 0 24 24"><path d="M3 11V5a2 2 0 0 1 2-2h6l10 10-8 8z"/><circle cx="8" cy="8" r="1.3"/></svg>Gestisci i tag</button>`;
 }
 else if(view==='tags'){
  const c=allTags(),k=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  m.innerHTML=`<div class="cnt">${k.length} tag in uso</div>`+(k.length?k.map(([t,n])=>`<div class="trow"><p>${esc(t)}</p><span class="n">${n}</span>
   <button onclick="rinomina('${esc(t)}')" aria-label="Rinomina">${I.pen}</button>
   <button onclick="unisci('${esc(t)}')" aria-label="Unisci"><svg viewBox="0 0 24 24"><path d="M7 4v6a4 4 0 0 0 4 4h8"/><path d="M17 4v6a4 4 0 0 1-4 4H5"/></svg></button>
   <button onclick="delTag('${esc(t)}')" aria-label="Elimina">${I.cest}</button></div>`).join(''):'<div class="empty"><b>Ancora nessun tag</b>Nascono quando salvi qualcosa.</div>');
 }
 else{
  const r=results(),tot=view==='area'?D.filter(i=>i.a===area).length:D.filter(i=>!i.tg.length).length;
  m.innerHTML=`<div class="cnt">${r.length} su ${tot}${ftg.length?' · '+ftg.join(', '):''}</div>`
   +(r.length?r.map(row).join(''):`<div class="empty"><b>Niente qui</b>${ftg.length?'Togli un filtro per riallargare.':'Condividi qualcosa per iniziare.'}</div>`);
 }
}
function home(){view='home';area='';q='';ftg=[];edit=false;render();$('main').scrollTop=0}
function openArea(a){view='area';area=a;q='';ftg=[];render();$('main').scrollTop=0}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function close_(){$('sheet').classList.remove('open');if(recT){clearInterval(recT);recT=null}if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();mediaRec.stream.getTracks().forEach(t=>t.stop());mediaRec=null}}
function sheet(h){$('panel').innerHTML=h;$('sheet').classList.add('open')}

/* ---------- aree ---------- */
const swatches=()=>`<div class="sw">${Object.entries(PAL).map(([k,c])=>`<button style="background:${c[0]}" class="${pickC===k?'on':''}" onclick="pickC='${k}';[...document.querySelectorAll('.sw button')].forEach(b=>b.classList.remove('on'));this.classList.add('on')" aria-label="${k}"></button>`).join('')}</div>`;
function newArea(){pickC='viola';sheet(`<h3>Nuova area</h3><p class="fl">Nome</p><input class="tx" id="na" placeholder="Viaggi">
 <p class="fl" style="margin-top:14px">Colore</p>${swatches()}
 <button class="save" onclick="addArea()">Crea</button><button class="ghost" onclick="close_()">Annulla</button>`);setTimeout(()=>$('na').focus(),90)}
async function addArea(){const v=$('na').value.trim();if(!v){toast('Scrivi un nome');return}
 if(AN().includes(v)){toast('Esiste già');return}
 AREE.push({n:v,c:pickC});await put('areas',{n:v,c:pickC});close_();render();toast('Area creata')}
function editArea(n){const a=AREE.find(x=>x.n===n);if(!a)return;pickC=a.c;
 sheet(`<h3>Modifica area</h3><p class="fl">Nome</p><input class="tx" id="na" value="${esc(a.n)}">
 <p class="fl" style="margin-top:14px">Colore</p>${swatches()}
 <button class="save" onclick="saveArea('${esc(n)}')">Salva</button>
 <button class="ghost danger" onclick="delArea('${esc(n)}')">Elimina area</button>
 <button class="ghost" onclick="close_()">Annulla</button>`)}
async function saveArea(old){const v=$('na').value.trim();if(!v){toast('Scrivi un nome');return}
 const a=AREE.find(x=>x.n===old);a.n=v;a.c=pickC;
 if(v!==old){await del('areas',old);for(const i of D)if(i.a===old){i.a=v;await put('items',i)}}
 await put('areas',{n:v,c:pickC});if(area===old)area=v;close_();render();toast('Area aggiornata')}
async function delArea(n){
 const q1=D.filter(i=>i.a===n).length;
 sheet(`<h3>Eliminare «${esc(n)}»?</h3><p style="font-size:14px;color:var(--mut);margin:0 0 4px">${q1?'Le '+q1+' voci non vengono cancellate: tornano fra quelle da smistare.':'Questa area è vuota.'}</p>
 <button class="save danger" style="background:#A32D2D" onclick="doDelArea('${esc(n)}')">Elimina</button><button class="ghost" onclick="close_()">Annulla</button>`)}
async function doDelArea(n){
 for(const i of D)if(i.a===n){i.a='';await put('items',i)}
 AREE=AREE.filter(x=>x.n!==n);await del('areas',n);
 if(area===n)view='home';close_();render();toast('Area eliminata')}

/* ---------- filtri e dettaglio ---------- */
function filtri(){
 const base=D.filter(i=>view==='area'?i.a===area:!i.tg.length),c={};
 base.forEach(i=>i.tg.forEach(t=>c[t]=(c[t]||0)+1));
 const k=Object.entries(c).sort((a,b)=>b[1]-a[1]);
 sheet(`<h3>Filtri</h3><p class="fl">Tag</p><div class="chips">${k.length?k.map(([t,n])=>`<button class="chip ${ftg.includes(t)?'on':''}" onclick="tgf('${esc(t)}')">${esc(t)}<span class="n">${n}</span></button>`).join(''):'<span class="chip">nessun tag qui</span>'}</div>
 <button class="save" onclick="close_()">Applica</button><button class="ghost" onclick="ftg=[];close_();render()">Azzera i filtri</button>`)}
function tgf(t){ftg.includes(t)?ftg=ftg.filter(x=>x!==t):ftg.push(t);filtri();render()}
function det(id){const i=D.find(x=>x.id===id);if(!i)return;
 sheet(`<h3>${esc(i.ti||'Senza descrizione')}</h3>
 ${i.t==='foto'&&i.blob?`<img class="prev" src="${oUrl(i)}" alt="">`:''}
 ${i.t==='vocale'&&i.blob?`<audio controls src="${oUrl(i)}"></audio>`:''}
 ${i.s&&i.t==='link'?`<p style="margin:0 0 12px"><a href="${esc(i.s)}" target="_blank" rel="noopener" class="mono" style="font-size:12px;color:var(--ac);word-break:break-all">${esc(i.s)}</a></p>`:''}
 <div class="chips">${i.tg.map(t=>`<span class="chip on">${esc(t)}</span>`).join('')||'<span class="chip">senza tag</span>'}</div>
 <p class="mono" style="font-size:11.5px;color:var(--fnt);margin-top:12px">${[i.a,fmt(i.d)].filter(Boolean).join(' · ')}</p>
 <button class="save" onclick="editItem(${i.id})">Modifica</button>
 <button class="ghost danger" onclick="delItem(${i.id})">Elimina</button>
 <button class="ghost" onclick="close_()">Chiudi</button>`)}
async function delItem(id){await del('items',id);D=D.filter(x=>x.id!==id);close_();render();toast('Eliminato')}
function editItem(id){const i=D.find(x=>x.id===id);C={...i,typed:'',editing:true};drawCap()}

/* ---------- cattura ---------- */
function cap(o){C={t:'nota',ti:'',tg:[],a:'',s:'',typed:'',...o};drawCap();setTimeout(()=>{const d=$('ds');if(d)d.focus()},120)}
function drawCap(){
 const o=C,dup=(o.t==='link'&&!o.editing)?findDup(o.s):null;
 sheet(`<h3>${o.editing?'Modifica':(o.from||({link:'Nuovo link',foto:'Nuova foto',nota:'Nuovo appunto',vocale:'Vocale registrato'})[o.t])}</h3>
 <div id="dupbox">${dupHTML()}</div>
 ${o.t==='foto'&&o.blob?`<img class="prev" src="${URL.createObjectURL(o.blob)}" alt="">`:''}
 ${o.t==='vocale'&&o.blob?`<audio controls src="${URL.createObjectURL(o.blob)}"></audio>`:''}
 ${o.t==='link'?`<p class="fl">Indirizzo</p><input class="tx" id="ur" value="${esc(o.s||'')}" placeholder="https://" inputmode="url" oninput="C.s=this.value;refreshDup()" style="margin-bottom:14px">`:''}
 <p class="fl">Descrizione</p><textarea id="ds" rows="2" placeholder="Perché lo stai salvando">${esc(o.ti||'')}</textarea>
 <p class="fl" style="margin-top:14px">Tag</p>
 <div class="tagbox"><div class="sel" id="selbox">${selHTML()}</div>
 <input id="ti" placeholder="scrivi o scegli qui sotto" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
 <div class="sug" id="sugbox">${sugHTML()}</div>
 <div class="row"><div><p class="fl">Area</p><select id="ar" onchange="C.a=this.value;refreshSug()"><option value="">nessuna</option>${AN().map(a=>`<option ${o.a===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div>
 <div><p class="fl">Data</p><input class="tx" id="dt" type="date" value="${o.d||today()}"></div></div>
 <button class="save" onclick="salva()">Salva</button><button class="ghost" onclick="close_()">Annulla</button>`);
 const ti=$('ti');
 ti.oninput=()=>{C.typed=ti.value.toLowerCase();refreshSug()};
 ti.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();const v=ti.value.trim();if(v)addtag(v)}};
}
function selHTML(){return C.tg.map(t=>`<button class="chip on" onclick="untag('${esc(t)}')">${esc(t)} ✕</button>`).join('')}
function dupHTML(){
 if(C.t!=='link'||C.editing)return '';
 const d=findDup(C.s);if(!d||d.id===C.id)return '';
 return `<div class="dup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><p>Ce l'hai già: salvato il ${fmt(d.d)}${d.a?' in '+esc(d.a):' e non ancora smistato'}. <a onclick="det(${d.id})">Apri</a></p></div>`;
}
function refreshDup(){const e=$('dupbox');if(e)e.innerHTML=dupHTML()}
function refreshSel(){const e=$('selbox');if(e)e.innerHTML=selHTML()}
function refreshSug(){const e=$('sugbox');if(e)e.innerHTML=sugHTML()}
function keep(){const d=$('ds'),t=$('dt'),u=$('ur');if(d)C.ti=d.value;if(t)C.d=t.value;if(u)C.s=u.value}
function sugHTML(){
 const w=(C.typed||'').trim();
 const l=suggest(C.a,C.s,w).filter(t=>!C.tg.includes(t));
 let h=l.map(t=>`<button class="chip" onclick="addtag('${esc(t)}')">${esc(t)}</button>`).join('');
 if(w&&!l.includes(w))h+=`<button class="chip new" onclick="addtag('${esc(w)}')">crea «${esc(w)}»</button>`;
 if(!h)h='<span class="chip" style="border:0;padding-left:0">nessun tag ancora</span>';
 return `<div class="chips sugwrap">${h}</div>${warnHTML()}`;
}
function warnHTML(){
 const w=C.typed.trim();if(!w||Object.keys(allTags()).includes(w))return '';
 const s=simile(w,Object.keys(allTags()));
 return s?`<p class="warn">Esiste già «${esc(s)}», molto simile. Sicuro di volerne uno nuovo?</p>`:'';
}
function addtag(t){
 t=t.toLowerCase().trim();
 if(t&&!C.tg.includes(t))C.tg.push(t);
 C.typed='';const ti=$('ti');if(ti){ti.value='';ti.focus()}
 refreshSel();refreshSug();
}
function untag(t){C.tg=C.tg.filter(x=>x!==t);refreshSel();refreshSug()}
async function salva(){
 keep();
 const a=$('ar').value;
 const it={id:C.id||Date.now(),t:C.t,ti:C.ti||'Senza descrizione',tg:[...C.tg],a,s:C.s||'',d:$('dt').value||today(),blob:C.blob||null,dur:C.dur||''};
 await put('items',it);
 D=D.filter(x=>x.id!==it.id);D.push(it);
 close_();
 if(a){view='area';area=a}else view='smista';
 q='';ftg=[];render();toast(a?'Salvato in '+a:'Salvato da smistare');
}

/* ---------- foto ---------- */
function pickPhoto(){$('fpick').click()}
$('fpick').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)cap({t:'foto',blob:await shrink(f)})};
async function shrink(file,max=1600){
 try{
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',.8));
 }catch(err){return file}
}
async function pasteLink(){
 let v='';
 try{v=await navigator.clipboard.readText()}catch(e){}
 v=(v||'').trim();
 const m=v.match(/https?:\/\/\S+/);
 cap({t:'link',s:m?m[0]:'',from:'Cattura un link'});
 setTimeout(()=>{const u=$('ur');if(u&&!u.value)u.focus()},140);
}

/* ---------- vocale ---------- */
async function recorder(){
 let st;
 try{st=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){toast('Microfono non disponibile');return}
 chunks=[];mediaRec=new MediaRecorder(st);
 mediaRec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 mediaRec.onstop=()=>{st.getTracks().forEach(t=>t.stop());
  const b=new Blob(chunks,{type:mediaRec.mimeType||'audio/webm'});
  const dur=Math.floor(recS/60)+':'+String(recS%60).padStart(2,'0');
  mediaRec=null;cap({t:'vocale',blob:b,dur,s:dur})};
 mediaRec.start();recS=0;
 sheet(`<h3>Registra</h3><div class="dial"><button class="dot live" onclick="stopRec()">${I.vocale}</button><div class="tm" id="tm">0:00</div><p class="hint">Tocca per fermare</p></div><button class="ghost" onclick="close_()">Annulla</button>`);
 recT=setInterval(()=>{recS++;const e=$('tm');if(e)e.textContent=Math.floor(recS/60)+':'+String(recS%60).padStart(2,'0')},1000);
}
function stopRec(){if(recT){clearInterval(recT);recT=null}if(mediaRec&&mediaRec.state==='recording')mediaRec.stop()}

/* ---------- tag ---------- */
function rinomina(t){sheet(`<h3>Rinomina tag</h3><p class="fl">Nuovo nome</p><input class="tx" id="rn" value="${esc(t)}">
 <button class="save" onclick="doRen('${esc(t)}')">Rinomina</button><button class="ghost" onclick="close_();render()">Annulla</button>`);setTimeout(()=>$('rn').select(),90)}
async function doRen(t){const v=$('rn').value.toLowerCase().trim();if(!v){toast('Scrivi un nome');return}
 for(const i of D)if(i.tg.includes(t)){i.tg=[...new Set(i.tg.map(x=>x===t?v:x))];await put('items',i)}
 close_();render();toast('Rinominato in «'+v+'»')}
function delTag(t){
 const n=D.filter(i=>i.tg.includes(t)).length;
 sheet(`<h3>Eliminare «${esc(t)}»?</h3><p style="font-size:14px;color:var(--mut);margin:0 0 4px">Il tag sparisce da ${n} voci. Le voci restano.</p>
 <button class="save" style="background:#A32D2D" onclick="doDelTag('${esc(t)}')">Elimina il tag</button><button class="ghost" onclick="close_();render()">Annulla</button>`)}
async function doDelTag(t){
 for(const i of D)if(i.tg.includes(t)){i.tg=i.tg.filter(x=>x!==t);await put('items',i)}
 close_();render();toast('Tag eliminato')}
function unisci(t){const o=Object.keys(allTags()).filter(x=>x!==t);
 if(!o.length){toast('Serve almeno un altro tag');return}
 sheet(`<h3>Unisci «${esc(t)}»</h3><p class="fl">Confluisce in</p><select id="mg">${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
 <p class="warn" style="color:var(--mut)">Le voci con «${esc(t)}» prenderanno il tag scelto.</p>
 <button class="save" onclick="doMerge('${esc(t)}')">Unisci</button><button class="ghost" onclick="close_();render()">Annulla</button>`)}
async function doMerge(t){const v=$('mg').value;
 for(const i of D)if(i.tg.includes(t)){i.tg=[...new Set(i.tg.map(x=>x===t?v:x))];await put('items',i)}
 close_();render();toast('Uniti in «'+v+'»')}

/* ---------- impostazioni, backup ---------- */
function impostazioni(){
 const n=D.length,mb=(D.reduce((s,i)=>s+(i.blob?i.blob.size:0),0)/1048576).toFixed(1);
 sheet(`<h3>Impostazioni</h3>
 <p style="font-size:14px;color:var(--mut);margin:0 0 14px">${n} voci · ${mb} MB di foto e vocali</p>
 <button class="save" onclick="esporta()">Esporta backup JSON</button>
 <button class="ghost" onclick="document.getElementById('imp').click()">Importa backup</button>
 <input type="file" id="imp" accept="application/json" style="display:none" onchange="importa(this)">
 <button class="ghost" onclick="persist()">Chiedi ad Android di non cancellare i dati</button>
 <button class="ghost" onclick="close_()">Chiudi</button>`)}
async function persist(){
 if(!navigator.storage||!navigator.storage.persist){toast('Non supportato qui');return}
 const ok=await navigator.storage.persist();toast(ok?'Archivio protetto':'Android ha rifiutato, riprova più avanti')}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function esporta(){
 const out={v:1,at:new Date().toISOString(),aree:AREE,items:[]};
 for(const i of D){const o={...i};if(i.blob){o.blob=await b2d(i.blob);o.mime=i.blob.type}out.items.push(o)}
 const u=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
 const a=document.createElement('a');a.href=u;a.download='second-brain-'+today()+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Backup scaricato')}
async function importa(el){
 const f=el.files[0];el.value='';if(!f)return;
 try{
  const j=JSON.parse(await f.text());
  for(const a of (j.aree||[])){if(!AN().includes(a.n)){AREE.push(a);await put('areas',a)}}
  let n=0;
  for(const it of (j.items||[])){
   if(D.some(x=>x.id===it.id))continue;
   const o={...it};
   if(typeof o.blob==='string'){const r=await fetch(o.blob);o.blob=await r.blob()}
   await put('items',o);D.push(o);n++;
  }
  close_();render();toast(n+' voci importate');
 }catch(e){toast('File non valido')}
}

/* ---------- condivisione in arrivo ---------- */
async function checkPending(){
 const p=await all('pending');
 if(!p.length)return false;
 const s=p[p.length-1];
 for(const x of p)await del('pending',x.id);
 const url=(s.url||'').trim()||((s.text||'').match(/https?:\/\/\S+/)||[''])[0];
 const desc=(s.title||'').trim()||(s.text||'').replace(url,'').trim();
 if(s.file&&s.file.size)cap({t:'foto',blob:await shrink(s.file),ti:desc,from:'Foto condivisa'});
 else if(url)cap({t:'link',s:url,ti:desc,from:'Contenuto condiviso'});
 else if(desc)cap({t:'nota',ti:desc,from:'Testo condiviso'});
 else return false;
 return true;
}

/* ---------- avvio ---------- */
async function boot(){
 try{
  D=await all('items');AREE=await all('areas');
 }catch(e){document.getElementById('main').innerHTML='<div class="empty"><b>Archivio non accessibile</b>Controlla di non essere in navigazione privata.</div>';return}
 if(!AREE.length){AREE=[{n:'Lavoro',c:'blu'},{n:'Casa',c:'ambra'},{n:'Idee',c:'verde'}];for(const a of AREE)await put('areas',a)}
 render();
 await checkPending();
 if(location.search)history.replaceState({},'',location.pathname);
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('sheet').classList.contains('open'))checkPending()});
boot();
</script>
